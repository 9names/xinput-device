[package]
name = "xinput-device"
version = "0.1.0"
authors = ["Timo Kröger <timokroeger93@gmail.com>", "9names"]
description = "USB XInput device driver for embassy-usb"
edition = "2024"
license = "MIT/Apache-2.0"
repository = "https://github.com/9names/xinput-device"

[features]
defmt = ["dep:defmt"]

[dependencies]
defmt = { version = "1.0.1", optional = true }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt", "generic-queue-8"] }
embassy-usb = { version = "0.5.1", features = [
    "defmt",
    "max-interface-count-8",
] }

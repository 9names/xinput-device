on: [push, pull_request]
name: Check examples
jobs:
  build_and_test:
    name: Build and test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        toolchain:
          - stable
        working-directory:
          - examples/nrf52840-xinput-device
          - examples/rp2040-xinput-device
          - examples/stm32f411-xinput-device
    steps:
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: thumbv6m-none-eabi
          components: rustfmt,clippy
      - run: ls 1>&2
      - run: cd ${{ matrix.working-directory }}
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: cargo build --verbose
      - run: cargo fmt -- --check
      - run: cargo clippy
